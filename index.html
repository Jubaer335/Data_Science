<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Data Analyzer & Visualizer</title>
    <!-- Include PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Include Plotly.js for visualizations -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Include simple.css for basic, clean styling -->
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <style>
        body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        #upload-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px dashed #ccc;
            text-align: center;
            border-radius: 8px;
        }
        #preprocessing-log {
            background-color: #f9f9f9;
            padding: 15px;
            border-left: 5px solid #007bff;
            margin-bottom: 30px;
            display: none;
            color: #333;
        }
        .viz-container {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .viz-description {
            margin-top: 10px;
            font-style: italic;
            color: #555;
        }
        #visualizations-section {
            display: none;
        }
        .chart {
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>
    <header>
        <h1>CSV Data Analyzer & Visualizer</h1>
        <p>Upload a CSV file to automatically preprocess, analyze, and visualize your data entirely in your browser.</p>
    </header>

    <main>
        <section id="upload-section">
            <h3>Upload your CSV</h3>
            <input type="file" id="csv-file" accept=".csv" />
            <p><small>Note: All processing happens in your browser. No data is sent to a server.</small></p>
        </section>

        <section id="preprocessing-log">
            <h3>Preprocessing Steps Taken:</h3>
            <ul id="log-list"></ul>
        </section>

        <section id="visualizations-section">
            <h2>Data Visualizations</h2>
            <div id="charts-container"></div>
        </section>
    </main>


    <script>
        document.getElementById('csv-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Reset UI
            document.getElementById('log-list').innerHTML = '';
            document.getElementById('preprocessing-log').style.display = 'none';
            document.getElementById('charts-container').innerHTML = '';
            document.getElementById('visualizations-section').style.display = 'none';

            Papa.parse(file, {
                header: true,
                dynamicTyping: true, // Automatically convert numbers and booleans
                skipEmptyLines: true,
                complete: function(results) {
                    const rawData = results.data;
                    if (rawData.length === 0) {
                        alert("The CSV file appears to be empty.");
                        return;
                    }
                    processData(rawData);
                },
                error: function(error) {
                    alert("Error parsing CSV: " + error.message);
                }
            });
        });

        function addLog(message) {
            const logList = document.getElementById('log-list');
            const li = document.createElement('li');
            li.textContent = message;
            logList.appendChild(li);
            document.getElementById('preprocessing-log').style.display = 'block';
        }

        function processData(rawData) {
            addLog(`Successfully loaded CSV with ${rawData.length} rows and ${Object.keys(rawData[0]).length} columns.`);

            let data = [...rawData];
            let columns = Object.keys(data[0]);

            // 1. Remove columns with >50% missing values
            const totalRows = data.length;
            const columnsToRemove = [];

            columns.forEach(col => {
                let missingCount = 0;
                data.forEach(row => {
                    if (row[col] === null || row[col] === undefined || row[col] === '') {
                        missingCount++;
                    }
                });

                if (missingCount / totalRows > 0.5) {
                    columnsToRemove.push(col);
                }
            });

            if (columnsToRemove.length > 0) {
                data.forEach(row => {
                    columnsToRemove.forEach(col => delete row[col]);
                });
                columns = columns.filter(col => !columnsToRemove.includes(col));
                addLog(`Dropped column(s): ${columnsToRemove.join(', ')} because they had more than 50% missing values.`);
            }

            // 2. Remove columns with only 1 unique value
            const singleValueColumns = [];
            columns.forEach(col => {
                const uniqueValues = new Set();
                data.forEach(row => {
                    if (row[col] !== null && row[col] !== undefined && row[col] !== '') {
                        uniqueValues.add(row[col]);
                    }
                });
                if (uniqueValues.size <= 1) {
                    singleValueColumns.push(col);
                }
            });

            if (singleValueColumns.length > 0) {
                data.forEach(row => {
                    singleValueColumns.forEach(col => delete row[col]);
                });
                columns = columns.filter(col => !singleValueColumns.includes(col));
                addLog(`Dropped column(s): ${singleValueColumns.join(', ')} because they contained only 1 unique value (or no values).`);
            }

            // 3. Remove duplicate rows
            const uniqueRows = new Set();
            const duplicateIndices = [];
            const dataWithoutDuplicates = [];

            data.forEach((row, index) => {
                const rowString = JSON.stringify(row);
                if (uniqueRows.has(rowString)) {
                    duplicateIndices.push(index);
                } else {
                    uniqueRows.add(rowString);
                    dataWithoutDuplicates.push(row);
                }
            });

            if (duplicateIndices.length > 0) {
                addLog(`Dropped ${duplicateIndices.length} duplicate row(s).`);
                data = dataWithoutDuplicates;
            }

            // 4. Impute missing values (mean for numbers, drop row for categoricals)
            let rowsDropped = 0;
            const finalData = [];

            // First calculate means for numerical columns
            const colMeans = {};
            columns.forEach(col => {
                let sum = 0;
                let count = 0;
                let isNumeric = false;
                data.forEach(row => {
                    if (typeof row[col] === 'number') {
                        isNumeric = true;
                        sum += row[col];
                        count++;
                    }
                });
                if (isNumeric && count > 0) {
                    colMeans[col] = sum / count;
                }
            });

            data.forEach(row => {
                let keepRow = true;
                columns.forEach(col => {
                    if (row[col] === null || row[col] === undefined || row[col] === '') {
                        if (colMeans.hasOwnProperty(col)) {
                            // Impute with mean
                            row[col] = colMeans[col];
                        } else {
                            // Categorical/Text missing -> drop row
                            keepRow = false;
                        }
                    }
                });

                if (keepRow) {
                    finalData.push(row);
                } else {
                    rowsDropped++;
                }
            });

            data = finalData;

            if (Object.keys(colMeans).length > 0) {
                addLog(`Filled missing numerical values with their column average.`);
            }
            if (rowsDropped > 0) {
                addLog(`Dropped ${rowsDropped} row(s) because they contained missing categorical/text values.`);
            }

            addLog(`Preprocessing complete. Final dataset has ${data.length} rows and ${columns.length} columns.`);

            if (data.length === 0) {
                alert("After preprocessing, no data remains to visualize.");
                return;
            }

            analyzeAndVisualize(data, columns);
        }

        function analyzeAndVisualize(data, columns) {
            // Determine column types (numerical vs categorical)
            const numCols = [];
            const catCols = [];

            columns.forEach(col => {
                let isNumeric = false;
                for (let i = 0; i < Math.min(10, data.length); i++) {
                    if (typeof data[i][col] === 'number') {
                        isNumeric = true;
                        break;
                    }
                }
                if (isNumeric) {
                    numCols.push(col);
                } else {
                    catCols.push(col);
                }
            });

            // Calculate correlation matrix for numerical columns
            const correlations = [];
            for (let i = 0; i < numCols.length; i++) {
                correlations[i] = [];
                for (let j = 0; j < numCols.length; j++) {
                    if (i === j) {
                        correlations[i][j] = 1;
                    } else if (i < j) {
                        const corr = calculatePearsonCorrelation(data, numCols[i], numCols[j]);
                        correlations[i][j] = corr;
                    } else {
                        correlations[i][j] = correlations[j][i];
                    }
                }
            }

            renderVisualizations(data, numCols, catCols, correlations);
        }

        function calculatePearsonCorrelation(data, col1, col2) {
            let sum1 = 0, sum2 = 0, sum1Sq = 0, sum2Sq = 0, pSum = 0;
            const n = data.length;
            if (n === 0) return 0;

            for (let i = 0; i < n; i++) {
                const val1 = data[i][col1];
                const val2 = data[i][col2];
                sum1 += val1;
                sum2 += val2;
                sum1Sq += val1 * val1;
                sum2Sq += val2 * val2;
                pSum += val1 * val2;
            }

            const num = pSum - (sum1 * sum2 / n);
            const den = Math.sqrt((sum1Sq - (sum1 * sum1) / n) * (sum2Sq - (sum2 * sum2) / n));
            if (den === 0) return 0;
            return num / den;
        }

        function renderVisualizations(data, numCols, catCols, correlations) {
            const container = document.getElementById('charts-container');
            document.getElementById('visualizations-section').style.display = 'block';
            let chartIdCounter = 0;

            function createChartContainer(title, descriptionText) {
                const id = 'chart-' + chartIdCounter++;
                const wrapper = document.createElement('div');
                wrapper.className = 'viz-container';

                const heading = document.createElement('h3');
                heading.textContent = title;
                wrapper.appendChild(heading);

                const chartDiv = document.createElement('div');
                chartDiv.id = id;
                chartDiv.className = 'chart';
                wrapper.appendChild(chartDiv);

                const desc = document.createElement('p');
                desc.className = 'viz-description';
                desc.textContent = descriptionText;
                wrapper.appendChild(desc);

                container.appendChild(wrapper);
                return id;
            }

            // 1. Histograms for Numerical Columns
            numCols.forEach(col => {
                const colData = data.map(row => row[col]);
                const sum = colData.reduce((a, b) => a + b, 0);
                const mean = (sum / colData.length).toFixed(2);

                const chartId = createChartContainer(
                    `Distribution of ${col}`,
                    `This histogram shows how the values for '${col}' are distributed. The average value is ${mean}.`
                );

                const trace = {
                    x: colData,
                    type: 'histogram',
                    marker: { color: '#007bff' }
                };
                Plotly.newPlot(chartId, [trace], { margin: { t: 20 } });
            });

            // 2. Bar Charts for Categorical Columns
            catCols.forEach(col => {
                const counts = {};
                data.forEach(row => {
                    const val = row[col];
                    counts[val] = (counts[val] || 0) + 1;
                });

                const labels = Object.keys(counts);
                const values = Object.values(counts);

                // Sort by frequency and take top 10 to avoid clutter
                const sortedIndices = labels.map((_, i) => i).sort((a, b) => values[b] - values[a]).slice(0, 10);
                const topLabels = sortedIndices.map(i => labels[i]);
                const topValues = sortedIndices.map(i => values[i]);

                const chartId = createChartContainer(
                    `Frequency of Categories in ${col}`,
                    `This bar chart displays the most common categories for '${col}'. The most frequent category is '${topLabels[0]}' with ${topValues[0]} occurrences.`
                );

                const trace = {
                    x: topLabels,
                    y: topValues,
                    type: 'bar',
                    marker: { color: '#28a745' }
                };
                Plotly.newPlot(chartId, [trace], { margin: { t: 20 } });
            });

            // 3. Correlation Heatmap
            if (numCols.length > 1) {
                const chartId = createChartContainer(
                    `Correlation Heatmap`,
                    `This heatmap displays the relationships between numerical variables. Darker reds indicate strong positive correlations, while darker blues indicate strong negative correlations.`
                );

                const trace = {
                    z: correlations,
                    x: numCols,
                    y: numCols,
                    type: 'heatmap',
                    colorscale: 'RdBu',
                    zmin: -1,
                    zmax: 1
                };
                Plotly.newPlot(chartId, [trace], { margin: { t: 20 } });
            }

            // 4. Scatter Plots for Highly Correlated Pairs
            if (numCols.length > 1) {
                const plottedPairs = new Set();
                for (let i = 0; i < numCols.length; i++) {
                    for (let j = i + 1; j < numCols.length; j++) {
                        const corr = correlations[i][j];
                        // Plot if strongly correlated (threshold 0.7 or -0.7)
                        if (Math.abs(corr) > 0.7) {
                            const pairName = `${numCols[i]}_${numCols[j]}`;
                            if (!plottedPairs.has(pairName)) {
                                plottedPairs.add(pairName);

                                const xData = data.map(row => row[numCols[i]]);
                                const yData = data.map(row => row[numCols[j]]);

                                const relationType = corr > 0 ? "positive" : "negative";
                                const chartId = createChartContainer(
                                    `Relationship: ${numCols[i]} vs ${numCols[j]}`,
                                    `This scatter plot shows a strong ${relationType} correlation (${corr.toFixed(2)}) between '${numCols[i]}' and '${numCols[j]}'.`
                                );

                                const trace = {
                                    x: xData,
                                    y: yData,
                                    mode: 'markers',
                                    type: 'scatter',
                                    marker: { color: '#dc3545' }
                                };
                                Plotly.newPlot(chartId, [trace], {
                                    xaxis: { title: numCols[i] },
                                    yaxis: { title: numCols[j] },
                                    margin: { t: 20 }
                                });
                            }
                        }
                    }
                }
            }
        }
    </script>

</body>
</html>
