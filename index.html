<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSV ML Pipeline Visualizer</title>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Plotly for Visualizations -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- TensorFlow.js for Neural Network -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 1200px; margin: auto; }
        .section { margin-bottom: 30px; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .viz-container { margin-bottom: 40px; }
        .chart { width: 100%; height: 500px; }
        ul { background: #f8f9fa; padding: 15px 35px; border-radius: 5px; }
        .hidden { display: none; }
        #loading { color: red; font-weight: bold; margin-top: 10px; }
        .tab { display: inline-block; padding: 10px 20px; cursor: pointer; background: #eee; border: 1px solid #ccc; }
        .tab.active { background: #007bff; color: #fff; }
        .tab-content { display: none; padding: 20px; border: 1px solid #ccc; border-top: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <h1>Data Science & ML Pipeline Visualizer</h1>

    <div class="section">
        <h2>1. Upload Data</h2>
        <input type="file" id="csv-file" accept=".csv" />
        <div id="loading" class="hidden">Processing Data & Training Models... Please wait.</div>
    </div>

    <div>
        <div id="tab-logs" class="tab active" onclick="switchTab('logs')">Preprocessing Logs</div>
        <div id="tab-viz" class="tab" onclick="switchTab('viz')">Visualizations</div>
        <div id="tab-ml" class="tab" onclick="switchTab('ml')">ML Results</div>
    </div>

    <div id="content-logs" class="tab-content active">
        <ul id="log-list"></ul>
    </div>

    <div id="content-viz" class="tab-content">
        <div id="charts-container"></div>
    </div>

    <div id="content-ml" class="tab-content">
        <div id="ml-container"></div>
    </div>

    <script src="preprocess.js"></script>
    <script src="ml.js"></script>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('content-' + tabName).classList.add('active');
        }

        document.getElementById('csv-file').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('log-list').innerHTML = '';
            document.getElementById('charts-container').innerHTML = '';
            document.getElementById('ml-container').innerHTML = '';

            const isTsv = file.name.endsWith('.tsv') || file.name.endsWith('.txt');
            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                delimiter: isTsv ? '\t' : undefined,
                complete: function(results) {
                    let data = results.data;
                    let columns = results.meta.fields;

                    // Allow UI to update before heavy processing
                    setTimeout(() => {
                        runPipeline(data, columns);
                    }, 100);
                }
            });
        });

        function addLogUI(msg) {
            let li = document.createElement('li');
            li.textContent = msg;
            document.getElementById('log-list').appendChild(li);
        }

        async function runPipeline(data, columns) {
            try {
                // 1. Preprocessing
                const preprocessed = preprocessData(data, columns);
                preprocessed.logs.forEach(addLogUI);
                data = preprocessed.data;
                columns = preprocessed.columns;

                if (data.length === 0) {
                    addLogUI("Error: No data remaining after preprocessing.");
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }

                const numCols = columns.filter(col => typeof data[0][col] === 'number' && col !== 'Target_enc');
                const catCols = columns.filter(col => typeof data[0][col] === 'string' && col !== 'Target');

                // 2. Pre-ML Visualizations
                renderVisualizations(data, numCols, catCols);

                // 3. Machine Learning
                if(columns.includes('Target_enc')) {
                    await runMLPipeline(data, columns.filter(c => c !== 'Target' && c !== 'Target_enc'));
                } else {
                    addLogUI("Target column not found. Skipping ML models.");
                }

            } catch (err) {
                console.error(err);
                addLogUI("Error occurred: " + err.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function createChartContainer(containerId, title, descriptionText) {
            const id = 'chart-' + Math.random().toString(36).substr(2, 9);
            const wrapper = document.createElement('div');
            wrapper.className = 'viz-container';

            const heading = document.createElement('h3');
            heading.textContent = title;
            wrapper.appendChild(heading);

            const chartDiv = document.createElement('div');
            chartDiv.id = id;
            chartDiv.className = 'chart';
            wrapper.appendChild(chartDiv);

            const desc = document.createElement('p');
            desc.className = 'viz-description';
            desc.textContent = descriptionText;
            wrapper.appendChild(desc);

            document.getElementById(containerId).appendChild(wrapper);
            return id;
        }

        function calculatePearsonCorrelation(data, col1, col2) {
            let sum1 = 0, sum2 = 0, sum1Sq = 0, sum2Sq = 0, pSum = 0;
            const n = data.length;
            if (n === 0) return 0;

            for (let i = 0; i < n; i++) {
                const val1 = data[i][col1];
                const val2 = data[i][col2];
                sum1 += val1;
                sum2 += val2;
                sum1Sq += val1 * val1;
                sum2Sq += val2 * val2;
                pSum += val1 * val2;
            }

            const num = pSum - (sum1 * sum2 / n);
            const den = Math.sqrt((sum1Sq - (sum1 * sum1) / n) * (sum2Sq - (sum2 * sum2) / n));
            if (den === 0) return 0;
            return num / den;
        }

        function renderVisualizations(data, numCols, catCols) {
            // Boxplots
            numCols.slice(0, 5).forEach(col => { // Limit to 5 to prevent overload
                const colData = data.map(row => row[col]);
                const chartId = createChartContainer('charts-container', `Boxplot of ${col}`, `Distribution and outliers for ${col}.`);
                Plotly.newPlot(chartId, [{ y: colData, type: 'box', name: col }], { margin: { t: 20 } });
            });

            // Target Imbalance Bar Chart
            if (data.length > 0 && data[0].hasOwnProperty('Target')) {
                let counts = {};
                data.forEach(r => { counts[r.Target] = (counts[r.Target] || 0) + 1; });
                let labels = Object.keys(counts);
                let vals = Object.values(counts);
                let percentages = vals.map(v => (v / data.length) * 100);

                const chartId = createChartContainer('charts-container', `Target Imbalance`, `Percentage distribution of the Target classes.`);
                Plotly.newPlot(chartId, [{ x: labels, y: percentages, type: 'bar' }], { yaxis: { title: 'Percentage (%)' }});
            }

            // Correlation Heatmap
            if (numCols.length > 1) {
                let topNumCols = numCols.slice(0, 15); // Limit for performance
                let correlations = topNumCols.map(c1 => topNumCols.map(c2 => calculatePearsonCorrelation(data, c1, c2)));

                const chartId = createChartContainer('charts-container', `Correlation Heatmap`, `Correlations between selected numerical features.`);
                Plotly.newPlot(chartId, [{ z: correlations, x: topNumCols, y: topNumCols, type: 'heatmap', colorscale: 'RdBu', zmin: -1, zmax: 1 }]);
            }
        }

        async function runMLPipeline(data, featureCols) {
            addLogUI("Starting ML Pipeline (Train/Test Split & Scaling)...");

            let { X_train, X_test, y_train, y_test } = trainTestSplit(data, 'Target_enc', 0.2);

            let scaler = new MinMaxScaler();
            scaler.fit(X_train, featureCols);
            let X_train_scaled = scaler.transform(X_train, featureCols);
            let X_test_scaled = scaler.transform(X_test, featureCols);

            let X_train_mat = toMatrix(X_train_scaled, featureCols);
            let X_test_mat = toMatrix(X_test_scaled, featureCols);
            let numClasses = new Set(y_train).size;
            let classLabels = Array.from(new Set(data.map(r=>r.Target))).sort();

            let results = {};

            // KNN
            addLogUI("Training KNN (k=3)...");
            let knn = new KNN(3);
            knn.fit(X_train_mat, y_train);
            let y_pred_knn = knn.predict(X_test_mat);
            results['KNN'] = { acc: calculateAccuracy(y_test, y_pred_knn), pred: y_pred_knn };

            // Naive Bayes
            addLogUI("Training Gaussian Naive Bayes...");
            let nb = new GaussianNB();
            nb.fit(X_train_mat, y_train);
            let y_pred_nb = nb.predict(X_test_mat);
            results['Naive Bayes'] = { acc: calculateAccuracy(y_test, y_pred_nb), pred: y_pred_nb };

            // Neural Net (TFJS)
            addLogUI("Training Neural Network (TensorFlow.js)...");
            const model = tf.sequential();
            model.add(tf.layers.dense({ units: 64, activation: 'relu', inputShape: [featureCols.length] }));
            model.add(tf.layers.dense({ units: 32, activation: 'relu' }));
            model.add(tf.layers.dense({ units: numClasses, activation: 'softmax' }));

            model.compile({ optimizer: tf.train.adam(0.001), loss: 'sparseCategoricalCrossentropy', metrics: ['accuracy'] });

            // tfjs expects float32 arrays for dense inputs
            const xs = tf.tensor2d(X_train_mat, [X_train_mat.length, featureCols.length], 'float32');
            const ys = tf.tensor1d(y_train, 'float32'); // Workaround for tfjs sparseCategoricalCrossentropy floor bug with int32

            // Limit epochs for browser performance
            await model.fit(xs, ys, { epochs: 10, batchSize: 32 });

            const xs_test = tf.tensor2d(X_test_mat, [X_test_mat.length, featureCols.length], 'float32');
            const preds = model.predict(xs_test);
            const y_pred_nn_tensor = preds.argMax(1);
            const y_pred_nn = Array.from(y_pred_nn_tensor.dataSync());
            results['Neural Net'] = { acc: calculateAccuracy(y_test, y_pred_nn), pred: y_pred_nn };

            xs.dispose(); ys.dispose(); xs_test.dispose(); preds.dispose(); y_pred_nn_tensor.dispose();

            // Visualize Results

            // Accuracy Bar Chart
            let modelNames = Object.keys(results);
            let accuracies = modelNames.map(m => results[m].acc);

            let accChartId = createChartContainer('ml-container', "Model Accuracy Comparison", "Comparison of accuracy across implemented models.");
            Plotly.newPlot(accChartId, [{ x: modelNames, y: accuracies, type: 'bar' }]);

            // Confusion Matrices
            modelNames.forEach(m => {
                let confMat = computeConfusionMatrix(y_test, results[m].pred, numClasses);
                let cmChartId = createChartContainer('ml-container', `${m} Confusion Matrix`, `Actual vs Predicted classes. Rows = Actual, Columns = Predicted.`);
                Plotly.newPlot(cmChartId, [{
                    z: confMat, x: classLabels, y: classLabels, type: 'heatmap', colorscale: 'Greens', reversescale: true
                }], { yaxis: { autorange: 'reversed' }});
            });

            addLogUI("ML Pipeline finished successfully!");
        }

    </script>
</body>
</html>
